name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every `nx` command below creates its own Nx Cloud run, like a CI setup
  # that calls nx once per target instead of once for everything.
  checks:
    name: checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [quality, tests, builds]
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - name: format
        if: matrix.shard == 'quality'
        run: pnpm nx format:check

      - name: lint
        if: matrix.shard == 'quality'
        run: pnpm nx run-many -t lint

      - name: typecheck
        if: matrix.shard == 'quality'
        run: pnpm nx run-many -t typecheck

      - name: test
        if: matrix.shard == 'tests'
        run: pnpm nx run-many -t test

      - name: test feature-greeting
        if: matrix.shard == 'tests'
        run: pnpm nx run @org/feature-greeting:test

      - name: test util-strings
        if: matrix.shard == 'tests'
        run: pnpm nx run @org/util-strings:test

      - name: build
        if: matrix.shard == 'builds'
        run: pnpm nx run-many -t build

      - name: build feature-greeting
        if: matrix.shard == 'builds'
        run: pnpm nx run @org/feature-greeting:build

      - name: affected
        if: matrix.shard == 'builds'
        run: pnpm nx affected -t lint test build typecheck

      - name: self-healing
        if: always()
        run: pnpm nx fix-ci

  # Single stable check name for the ruleset to require.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: all checks passed
        run: test "${{ needs.checks.result }}" = "success"
